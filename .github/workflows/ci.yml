name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The floor from `requires-python` and the current release, on all three
        # platforms: `config_dir()` branches per OS, font work is heavily macOS, and on
        # Windows a redirected stream falls back to the ANSI code page. A Linux-only
        # matrix exercised none of that — and the macOS jobs found a real bug the first
        # time they ran.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v7
        with:
          # The suite builds real git repos and diffs commit ranges; a shallow clone of
          # THIS repo is fine, but tags are needed for nothing here — keep it cheap.
          fetch-depth: 1

      - name: Install uv
        # Pinned to an exact release: setup-uv stopped publishing a moving major tag
        # after v7, so `@v10` does not resolve at all.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        # The suite shells out to git and must not inherit a runner identity it does not
        # have; every test repo configures its own. `-q` keeps the log readable.
        run: uv run pytest -q
