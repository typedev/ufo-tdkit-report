[project]
name = "ufo-tdkit-report"
version = "0.1.1"
description = "Deterministic git-centric source-change extractor & narrator for UFO/designspace font projects"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Alexander Lubovenko"}
]

keywords = [
    "ufo", "designspace", "font", "git", "diff", "release-notes",
    "changelog", "typography", "typedev",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
    "Topic :: Text Processing :: Fonts",
    "Topic :: Software Development :: Version Control :: Git",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
]

dependencies = [
    "fonttools>=4.38.0",
    "defcon",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.scripts]
tdreport = "ufo_tdkit_report.cli:main"

[project.urls]
Homepage = "https://github.com/typedev/ufo-tdkit-report"
Repository = "https://github.com/typedev/ufo-tdkit-report"
Issues = "https://github.com/typedev/ufo-tdkit-report/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ufo_tdkit_report"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
